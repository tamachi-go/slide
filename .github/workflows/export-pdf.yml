name: Export PDF

on:
  push:
    branches:
      - main
    paths:
      - 'slides/**'
  pull_request:
    paths:
      - 'slides/**'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Detect changed slide files
        if: github.event_name != 'workflow_dispatch'
        id: changed
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: slides/**/*.md

      - name: Export slide decks to PDF
        run: |
          mkdir -p output

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            targets=$(ls slides/*.md)
          else
            targets="${{ steps.changed.outputs.all_changed_files }}"
          fi

          if [ -z "$targets" ]; then
            echo "対象のスライドファイルが無いのでスキップします"
            exit 0
          fi

          for f in $targets; do
            name=$(basename "$f" .md)
            pnpm run switch -- "$name"
            pnpm run export -- "$name"
          done

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: slides-pdf
          path: output/*.pdf
